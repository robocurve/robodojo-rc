name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · type
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - name: Install from uv.lock (dev extras)
        run: uv sync --locked --python 3.11 --extra dev
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format check)
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - name: Install from uv.lock (dev extras)
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev
      - name: Pytest (100% coverage gate)
        run: uv run pytest --cov --cov-report=term-missing

  # The oldest supported Inspect Robots (pyproject's floor). 0.59 and 0.60 handle an unscored
  # trial differently from later versions, so the integration tests run on both sides.
  compat-min:
    name: test (inspect-robots 0.59.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install inspect-robots 0.59.0
        run: |
          uv venv --python 3.12
          uv pip install -e . "inspect-robots==0.59.0" pytest
      - name: Pytest
        run: uv run --no-sync pytest -q

  # Unreleased Inspect Robots: a heads-up when the next release would break us. Not in ci-ok.
  compat-main:
    name: test (inspect-robots main, informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install inspect-robots main
        run: |
          uv venv --python 3.12
          uv pip install "inspect-robots @ git+https://github.com/robocurve/inspect-robots" pytest
          uv pip install --no-deps -e .
      - name: Pytest
        run: uv run --no-sync pytest -q

  # Single required status check for branch protection: green iff every job
  # above is green (except compat-main). Add new jobs to 'needs' here or they won't gate merges.
  ci-ok:
    name: ci-ok
    if: ${{ always() }}
    needs: [quality, test, compat-min]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every needed job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'

  # Red main is a stop-the-line event: open an issue so it can't go unnoticed.
  # Only fires on pushes (i.e. merges to main), never on PR runs.
  alert-red-main:
    name: alert on red main
    if: ${{ failure() && github.event_name == 'push' }}
    needs: [quality, test, compat-min]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue unless one is already open
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "CI is red on main in:title" --json number --jq length)
          if [ "$existing" = "0" ]; then
            gh issue create -R "$GITHUB_REPOSITORY"               --title "CI is red on main (${GITHUB_SHA:0:8})"               --body "CI failed on a push to main: $RUN_URL — stop-the-line: fix forward or revert before merging anything else. If the failure is transient (network, external deps), re-run the failed jobs and close this."
          else
            echo "an open red-main issue already exists; not filing another"
          fi
